name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\JokerTool.exe dist\
          Copy-Item README.txt dist\
          Compress-Archive -Path dist\* -DestinationPath JokerTool-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: JokerTool-windows-x64
          path: JokerTool-windows-x64.zip

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: JokerTool-windows-x64.zip
          generate_release_notes: true
