[package]
name = "joker-tool"
version = "1.5.0"
edition = "2021"

[[bin]]
name = "JokerTool"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
once_cell = "1"
regex = "1"
eframe = "0.29"
egui = "0.29"
directories = "5"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
sha2 = "0.10"

[build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
tray-icon = { version = "0.21", default-features = false }
tauri-winrt-notification = "0.7"
raw-window-handle = "0.6"
winreg = "0.55"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
windows-dpapi = "0.2"
