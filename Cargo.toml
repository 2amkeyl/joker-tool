[package]
name = "joker-tool"
version = "1.1.0"
edition = "2021"

[[bin]]
name = "JokerTool"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
rand = "0.8"
once_cell = "1"
regex = "1"
eframe = "0.29"
egui = "0.29"
directories = "5"
parking_lot = "0.12"
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
winres = "0.1"
